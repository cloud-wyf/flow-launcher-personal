name: Publish to Winget

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'Flow-Launcher/Flow.Launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Flow-Launcher.Flow-Launcher
          token: ${{ secrets.WINGET_TOKEN }}
