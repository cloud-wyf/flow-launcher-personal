name: Assign PR to creator

on:
  pull_request_target:
    types: [opened]
    branches-ignore:
      - l10n_dev

permissions:
  pull-requests: write

jobs:
  automation:
    if: github.repository == 'Flow-Launcher/Flow.Launcher'
    runs-on: ubuntu-latest
    steps:
    - name: Assign PR to creator
      uses: toshimaru/auto-author-assign@v3.1.0
